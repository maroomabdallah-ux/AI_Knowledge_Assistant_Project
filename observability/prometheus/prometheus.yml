global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # The FastAPI server runs on the host during local development.
  - job_name: ai-knowledge-assistant
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
    relabel_configs:
      - target_label: service
        replacement: ai-knowledge-assistant
